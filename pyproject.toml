[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-processor"
version = "0.4.0"
description = "Local batch processor for lecture recordings."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [
  { name = "aaramos", email = "aaramos78@gmail.com" }
]
dependencies = []

[project.optional-dependencies]
transcription = [
  "faster-whisper>=1.0.0",
  "openai-whisper>=20231117",
  "pywhispercpp>=1.3.0"
]
slides = [
  "opencv-python>=4.8.0,<4.12",
  "Pillow>=10.0.0"
]
apple-silicon = [
  "pywhispercpp>=1.3.0",
  "coremltools>=8.0",
  "ane_transformers"
]
mlx = [
  "mlx-whisper>=0.4.0"
]
ai = [
  "google-genai>=1.0.0"
]
dev = []

[project.scripts]
lecture-processor = "lecture_processor.cli:main"
lecture-processor-app = "lecture_processor.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
